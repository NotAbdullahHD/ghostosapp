<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GhostOS · Spectre Browser</title>

<script src="./uv/uv.bundle.js"></script>
<script src="./uv/uv.config.js"></script>
<script src="/spectre/sj/scramjet.js"></script>
<script src="/spectre/sj/controller.api.js"></script>
<script src="/spectre/sj/epoxy.js" defer></script>
<script src="./baremux/index.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

<link rel="stylesheet" href="./browser.css">

</head>

<body>

<div class="browser-ui">
  <div class="tabs" id="tabs">
    <button class="newtab" id="newtab" title="New tab"><i class="fas fa-plus"></i></button>
  </div>

  <div class="navbar">
    <button id="back" title="Back"><i class="fas fa-arrow-left"></i></button>
    <button id="forward" title="Forward"><i class="fas fa-arrow-right"></i></button>
    <button id="reload" title="Reload"><i class="fas fa-rotate-right"></i></button>

    <form class="urlbar" id="form">
      <i class="fas fa-magnifying-glass lock"></i>
      <input id="url" placeholder="Search the web or enter an address" autocomplete="off" spellcheck="false">
    </form>

    <div id="statusChip" class="status-chip" title="Toggle diagnostics">
      <span class="status-dot"></span><span id="statusText">CONNECTING</span>
    </div>
    <button id="popout" title="Open in new tab"><i class="fas fa-external-link"></i></button>
  </div>
</div>

<div class="ntp" id="ntp">
  <div class="brand-mark"><i class="fas fa-ghost"></i></div>
  <h1>Ghost Browser</h1>
  <form id="startSearch" class="start-search"><input id="startQuery" aria-label="Search the web" placeholder="Search the web" autocomplete="off"><button title="Search" aria-label="Search">→</button></form>
  
</div>

<div class="diag" id="diag">
  <header>
    <span>GHOSTOS · DIAGNOSTICS</span>
    <button id="diagClose" title="Close">×</button>
  </header>
  <div class="row"><span class="k">Wisp Endpoint</span><span class="v" id="diagWisp">—</span></div>
  <div class="row"><span class="k">Transport</span><span class="v" id="diagTransport">/libcurl/index.mjs</span></div>
  <div class="row"><span class="k">BareMux</span><span class="v" id="diagBaremux">initializing…</span></div>
  <div class="row"><span class="k">Service Worker</span><span class="v" id="diagSw">pending</span></div>
  <div class="row"><span class="k">Connection</span><span class="v" id="diagConn">probing…</span></div>
  <div class="row"><span class="k">Last Error</span><span class="v" id="diagErr">none</span></div>
  <div class="actions">
    <button id="diagRetry">RETRY</button>
    <button id="diagNext">NEXT RELAY</button>
  </div>
  <div class="log" id="diagLog"></div>
</div>

<script>
/* ===== Wisp endpoints (failover list) ===== */
const WISP_ENDPOINTS = [
  "wss://wisp.mercurywork.shop/",
  "wss://anura.pro/",
  "wss://nebulaservices.org/wisp/",
  "wss://wisp.terbiumon.top/wisp/",
  "wss://wisp.rhw.one/"
];
let wispIndex = 0;

/* ===== Diagnostics helpers ===== */
const diag = document.getElementById("diag");
const diagWisp = document.getElementById("diagWisp");
const diagBaremux = document.getElementById("diagBaremux");
const diagSw = document.getElementById("diagSw");
const diagConn = document.getElementById("diagConn");
const diagErr = document.getElementById("diagErr");
const diagLog = document.getElementById("diagLog");
const statusChip = document.getElementById("statusChip");
const statusText = document.getElementById("statusText");

function log(msg, level = "info") {
  const line = document.createElement("div");
  const t = new Date().toLocaleTimeString();
  line.textContent = `[${t}] ${msg}`;
  if (level === "err") line.style.color = "#fca5a5";
  if (level === "ok") line.style.color = "#86efac";
  diagLog.prepend(line);
  console[level === "err" ? "error" : "log"]("[Spectre]", msg);
}
function setStatus(state, label) {
  statusChip.classList.remove("ok","err");
  if (state === "ok") statusChip.classList.add("ok");
  if (state === "err") statusChip.classList.add("err");
  statusText.textContent = label;
}
function setConn(state, label) {
  diagConn.className = "v " + (state === "ok" ? "good" : state === "err" ? "err" : "warn");
  diagConn.textContent = label;
}
statusChip.onclick = () => diag.classList.toggle("open");
document.getElementById("diagClose").onclick = () => diag.classList.remove("open");

/* ===== Transport setup with failover ===== */
let connection = null;
function applyTransport(idx) {
  const url = WISP_ENDPOINTS[idx];
  diagWisp.textContent = url;
  log("Setting transport → " + url);
  try {
    connection.setTransport("/spectre/libcurl/index.mjs", [{ wisp: url, websocket: url }]);
    diagBaremux.className = "v good";
    diagBaremux.textContent = "transport set";
    setConn("warn", "handshake pending");
    setStatus("warn", "RELAY READY");
  } catch (e) {
    diagBaremux.className = "v err";
    diagBaremux.textContent = "setTransport failed";
    diagErr.className = "v err"; diagErr.textContent = String(e?.message || e);
    log("setTransport error: " + e, "err");
    setStatus("err", "RELAY FAILED");
  }
}

function bootConnection() {
  try {
    connection = new BareMux.BareMuxConnection("/spectre/baremux/worker.js");
    log("BareMux connection created", "ok");
  } catch (e) {
    diagBaremux.className = "v err";
    diagBaremux.textContent = "init failed: " + e.message;
    log("BareMux init failed: " + e, "err");
    setStatus("err", "BAREMUX FAIL");
    return;
  }
  applyTransport(wispIndex);
}

/* ===== GhostOS preferences (passed from Settings) ===== */
const GHOST_PREFS = (() => {
  const p = new URLSearchParams(location.search);
  return {
    engine: p.get("engine") || "brave",
    proxy: p.get("proxy") || "scramjet",
    home: p.get("home") || "https://search.brave.com",
    newtab: p.get("newtab") || "ghost",
  };
})();

const SEARCH_ENGINES = {
  google: "https://www.google.com/search?q=",
  duckduckgo: "https://duckduckgo.com/?q=",
  brave: "https://search.brave.com/search?q=",
  bing: "https://www.bing.com/search?q=",
};

/* ===== Modular proxy providers ===== */
let scramjetController = null;
let scramjetReady = false;

/* Scramjet v2 (2.0.67-alpha.2): controller + epoxy transport over wisp. */
async function initScramjet() {
  try {
    if (!self.EpoxyTransport) await new Promise((r) => window.addEventListener("load", r, { once: true }));
    const reg = await navigator.serviceWorker.register("/spectre/sj/sw.js", { scope: "/spectre/sj/" });
    // The page itself is outside the worker's scope, so wait on this registration directly.
    const sw = reg.active || await new Promise((res) => {
      const w = reg.installing || reg.waiting;
      w.addEventListener("statechange", () => { if (w.state === "activated") res(w); });
    });
    const { Controller } = $scramjetController;
    const { defaultConfig } = $scramjet;
    const transport = new self.EpoxyTransport.default({ wisp: WISP_ENDPOINTS[wispIndex] });
    await transport.init();
    scramjetController = new Controller({
      serviceworker: sw,
      transport,
      scramjetConfig: defaultConfig,
      config: {
        prefix: "/spectre/sj/~/",
        scramjetPath: "/spectre/sj/scramjet.js",
        injectPath: "/spectre/sj/controller.inject.js",
        wasmPath: "/spectre/sj/scramjet.wasm",
      },
    });
    await scramjetController.wait();
    scramjetReady = true;
    log("Scramjet v2 ready", "ok");
  } catch (e) {
    scramjetReady = false;
    log("Scramjet init failed, falling back to Ultraviolet: " + e, "err");
  }
}

const PROVIDERS = {
  scramjet: {
    name: "Scramjet",
    ready: () => scramjetReady,
    open: (tab, url) => {
      if (!tab.sjFrame) tab.sjFrame = scramjetController.createFrame(tab.iframe);
      tab.sjFrame.go(url);
    },
  },
  ultraviolet: {
    name: "Ultraviolet",
    ready: () => true,
    open: (tab, url) => { tab.iframe.src = __uv$config.prefix + __uv$config.encodeUrl(url); },
  },
};

function activeProvider() {
  const wanted = PROVIDERS[GHOST_PREFS.proxy] || PROVIDERS.scramjet;
  return wanted.ready() ? wanted : PROVIDERS.ultraviolet;
}

/* ===== Service worker ===== */
diagSw.textContent = "registering…";
navigator.serviceWorker
  ?.register("./uv/sw.js", { scope: "/spectre/uv/" })
  .then((reg) => {
    diagSw.className = "v good";
    diagSw.textContent = "active (scope " + (reg.scope || "/spectre/uv/") + ")";
    log("Service worker registered", "ok");
  })
  .catch((e) => {
    diagSw.className = "v err";
    diagSw.textContent = "register failed";
    diagErr.className = "v err"; diagErr.textContent = String(e?.message || e);
    log("SW registration failed: " + e, "err");
    setStatus("err", "SW FAILED");
  });

bootConnection();
initScramjet();

/* ===== Retry / failover controls ===== */
document.getElementById("diagRetry").onclick = () => {
  log("Manual retry");
  applyTransport(wispIndex);
  const t = getTab(); if (t && t.history[t.index]) navigate(t.history[t.index], false);
};
document.getElementById("diagNext").onclick = () => {
  wispIndex = (wispIndex + 1) % WISP_ENDPOINTS.length;
  log("Cycling to next relay (" + (wispIndex+1) + "/" + WISP_ENDPOINTS.length + ")");
  applyTransport(wispIndex);
  const t = getTab(); if (t && t.history[t.index]) navigate(t.history[t.index], false);
};

/* ===== Browser shell ===== */
const tabsEl = document.getElementById("tabs");
const newTabBtn = document.getElementById("newtab");
const urlInput = document.getElementById("url");
const ntp = document.getElementById("ntp");

let tabs = [];
let activeId = null;
let idCounter = 0;
let loadTimer = null;

function createTab(url = "") {
  const id = idCounter++;
  const iframe = document.createElement("iframe");
  iframe.className = "viewframe";
  iframe.dataset.id = id;
  iframe.setAttribute("sandbox",
    "allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-presentation allow-downloads allow-pointer-lock allow-orientation-lock allow-top-navigation-by-user-activation allow-storage-access-by-user-activation"
  );
  iframe.setAttribute("allow",
    "autoplay; fullscreen; clipboard-read; clipboard-write; encrypted-media; picture-in-picture; gamepad; geolocation; camera; microphone; midi; payment; xr-spatial-tracking; accelerometer; gyroscope; magnetometer"
  );
  iframe.setAttribute("allowfullscreen", "true");
  iframe.referrerPolicy = "no-referrer";
  document.body.appendChild(iframe);

  const tabBtn = document.createElement("div");
  tabBtn.className = "tab";
  tabBtn.dataset.id = id;
  tabBtn.innerHTML = `<span>New Tab</span><i class="fas fa-xmark"></i>`;
  tabBtn.addEventListener("click", e => {
    if (e.target.tagName === "I") closeTab(id);
    else activateTab(id);
  });
  tabsEl.insertBefore(tabBtn, newTabBtn);

  tabs.push({ id, iframe, tabBtn, history: [], index: -1 });
  activateTab(id);
  if (url) navigate(url);
}

function activateTab(id) {
  activeId = id;
  tabs.forEach(t => {
    t.iframe.classList.toggle("active", t.id === id);
    t.tabBtn.classList.toggle("active", t.id === id);
  });
  const tab = getTab();
  if (!tab) return;
  if (tab.index >= 0) {
    urlInput.value = tab.history[tab.index];
    ntp.style.display = "none";
  } else {
    urlInput.value = "";
    ntp.style.display = "flex";
  }
}

function closeTab(id) {
  if (tabs.length === 1) return;
  const i = tabs.findIndex(t => t.id === id);
  const tab = tabs[i];
  tab.iframe.remove();
  tab.tabBtn.remove();
  tabs.splice(i, 1);
  activateTab(tabs[Math.max(0, i - 1)].id);
}

function normalize(input) {
  const s = input.trim();
  if (!s.includes(".") && !s.startsWith("http")) {
    const base = SEARCH_ENGINES[GHOST_PREFS.engine] || SEARCH_ENGINES.google;
    return base + encodeURIComponent(s);
  }
  if (!s.startsWith("http")) return "https://" + s;
  return s;
}

async function ensureTransport() {
  try {
    if (connection && (await connection.getTransport()) == null) {
      applyTransport(wispIndex);
    }
  } catch {
    applyTransport(wispIndex);
  }
}

async function navigate(input, push = true) {
  const tab = getTab();
  if (!tab) return;
  await ensureTransport();
  const url = normalize(input);

  if (push) {
    tab.history = tab.history.slice(0, tab.index + 1);
    tab.history.push(url);
    tab.index++;
  }
  setConn("warn", "loading " + new URL(url).hostname);
  log("Navigate → " + url);

  if (loadTimer) clearTimeout(loadTimer);
  loadTimer = setTimeout(() => {
    setConn("err", "timeout — try Next Relay");
    setStatus("err", "TIMEOUT");
    diagErr.className = "v err"; diagErr.textContent = "Load timeout (15s)";
    log("Load timeout for " + url, "err");
  }, 15000);

  const provider = activeProvider();
  diagBaremux.textContent = "proxy: " + provider.name;
  provider.open(tab, url);
  urlInput.value = url;
  ntp.style.display = "none";

  tab.iframe.onload = () => {
    clearTimeout(loadTimer);
    setConn("ok", "connected");
    setStatus("ok", "CONNECTED");
    diagErr.className = "v"; diagErr.textContent = "none";
    try {
      tab.tabBtn.querySelector("span").textContent =
        tab.iframe.contentDocument?.title || new URL(url).hostname;
    } catch {
      tab.tabBtn.querySelector("span").textContent = new URL(url).hostname;
    }
  };
}

function getTab() { return tabs.find(t => t.id === activeId); }

/* ===== Nav controls ===== */
back.onclick = () => {
  const t = getTab(); if (!t || t.index <= 0) return;
  t.index--; navigate(t.history[t.index], false);
};
forward.onclick = () => {
  const t = getTab(); if (!t || t.index >= t.history.length - 1) return;
  t.index++; navigate(t.history[t.index], false);
};
reload.onclick = () => {
  const t = getTab(); if (!t) return;
  if (t.index >= 0) navigate(t.history[t.index], false);
};
popout.onclick = () => {
  const t = getTab(); if (!t || !t.iframe.src) return;
  window.open(t.iframe.src, "_blank");
};
form.onsubmit = e => {
  e.preventDefault();
  if (urlInput.value.trim()) navigate(urlInput.value);
};
newTabBtn.onclick = () => createTab();

createTab();

/* ===== Deep-link & embed mode ===== */
(function initEmbed() {
  try {
    const params = new URLSearchParams(location.search);
    const chrome = params.get("chrome");
    if (chrome === "mini" || chrome === "none") {
      const ui = document.querySelector(".browser-ui");
      if (ui) ui.style.display = "none";
      document.body.classList.add("embed");
      const style = document.createElement("style");
      style.textContent = ".viewframe{top:0!important;height:100%!important}";
      document.head.appendChild(style);
    }
    const url = params.get("url") || (GHOST_PREFS.newtab === "homepage" ? GHOST_PREFS.home : null);
    if (url) {
      // Defer until UV config is ready
      setTimeout(() => navigate(url), 150);
    }
  } catch (e) { console.warn("embed init failed", e); }
})();

/* Surface low-level errors to diagnostics */
window.addEventListener("error", e => {
  if (e?.message && /BareMux|wisp|libcurl|transport/i.test(e.message)) {
    diagErr.className = "v err"; diagErr.textContent = e.message;
    log("Window error: " + e.message, "err");
  }
});
window.addEventListener("unhandledrejection", e => {
  const msg = String(e.reason?.message || e.reason || "");
  if (/BareMux|wisp|libcurl|transport|code 7/i.test(msg)) {
    diagErr.className = "v err"; diagErr.textContent = msg;
    log("Rejected: " + msg, "err");
    setStatus("err", "RELAY ERROR");
    setConn("err", "wisp handshake failed");
  }
});
</script>

</body>
</html>
